{% extends "taban.html" %}
{% block baslik %}İlk kurulum{% endblock %}
{% block icerik %}
<div class="tek-kutu">
  <p class="marka buyuk">OMS Montaj</p>
  <div class="kutu">
    <h1>Hoş geldiniz</h1>
    <p class="soluk">Uygulamada henüz hesap yok. İlk hesabı açın; ekibin diğer hesaplarını sonra Ayarlar > Kullanıcılar'dan eklersiniz.</p>
    {% if hata %}<p class="hata-kutusu" role="alert">{{ hata }}</p>{% endif %}
    <form method="post" class="form">
      <input type="hidden" name="csrf" value="{{ csrf_anahtari() }}">
      <label>Ad soyad
        <input type="text" name="ad_soyad" value="{{ request.form.ad_soyad }}" autocomplete="name" required autofocus>
      </label>
      <label>Kullanıcı adı
        <span class="ipucu">Girişte kullanacağınız ad; boşluksuz. Örnek: ad.soyad</span>
        <input type="text" name="kullanici_adi" value="{{ request.form.kullanici_adi }}" autocomplete="username" autocapitalize="none" required>
      </label>
      <label>Şifre
        <span class="ipucu">En az 8 karakter.</span>
        <input type="password" name="sifre" autocomplete="new-password" required>
      </label>
      <label>Şifre (tekrar)
        <input type="password" name="sifre_tekrar" autocomplete="new-password" required>
      </label>
      <button type="submit" class="dugme">Hesabı aç</button>
    </form>
  </div>
</div>
{% endblock %}
